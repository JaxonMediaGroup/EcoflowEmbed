    <!--
        Fix de posicionamiento responsive del chatbot (Terralago).
        El chatbot tiene DOS botones: el Lottie (visible, responsive) y el nativo de Flowise
        (oculto), al que Flowise ancla la ventana de chat usando PX FIJOS. Eso hacía que la
        ventana solo "cuadrara" a ~1280px: se iba al centro en pantallas anchas y se desbordaba
        en móvil. Este script reposiciona la ventana [part="bot"] para que abra SIEMPRE encima
        del botón Lottie, a cualquier resolución, y aplica clamp de tamaño en móvil.
        No modifica el JS del CDN; todo vive aquí.
    -->
    <style>
        /* Respaldo CSS vía ::part (penetra el shadow DOM). El JS de abajo tiene la palabra
           final con !important porque Flowise repinta dimensiones inline en cada apertura. */
        flowise-chatbot::part(bot) {
            right: auto !important;
            top: auto !important;
        }
    </style>
    <script>
    (function () {
        'use strict';
        var M = 12;       // margen de seguridad al borde del viewport (px)
        var GAP = 10;     // separación entre el botón Lottie y la ventana (px)
        var positioning = false;

        function clamp(v, min, max) { return Math.max(min, Math.min(max, v)); }

        function positionChatWindow() {
            if (positioning) return;
            var fw = document.querySelector('flowise-chatbot');
            if (!fw || !fw.shadowRoot) return;
            var bot = fw.shadowRoot.querySelector('[part="bot"]');
            if (!bot) return;
            var lottie = document.querySelector('[id^="flowise-lottie-trigger-"]');

            var VW = window.innerWidth, VH = window.innerHeight;

            // Posición del botón Lottie (ancla de la ventana).
            var lottieTop = lottie ? lottie.getBoundingClientRect().top : VH;

            // Espacio disponible ENCIMA del botón (donde debe abrir la ventana).
            // Es el alto del viewport menos el botón, el GAP y los márgenes.
            var spaceAbove = lottieTop - GAP - M;

            // Ancho deseado: 400 en escritorio; líquido en móvil para dejar aire.
            var wantW = VW <= 480 ? VW - M * 2 : clamp(400, M, VW - M * 2);

            // Alto deseado: lo que quepa encima del botón, acotado a un máximo razonable.
            // Así, en viewports bajos (p.ej. el iframe del hero a 568px), la ventana se achica
            // en vez de tapar al botón. En móvil sin mucho espacio, ocupa hasta el 70% del alto.
            var wantH;
            if (VW <= 480) {
                wantH = clamp(VH * 0.7, 200, spaceAbove > 0 ? spaceAbove : VH - M * 2);
            } else {
                wantH = clamp(500, 240, spaceAbove > 0 ? spaceAbove : VH - M * 2);
            }

            // Ancla horizontal izquierda: alineada al borde izquierdo del botón Lottie.
            var leftPx = M;
            if (lottie) {
                var r = lottie.getBoundingClientRect();
                leftPx = clamp(r.left, M, VW - wantW - M);
            }

            // Ancla vertical: la ventana abre ARRIBA del botón Lottie (bottom = distancia al top del lottie + GAP).
            var bottomPx = lottie ? (VH - lottieTop) + GAP : M;

            positioning = true;
            var s = bot.style;
            s.setProperty('left', leftPx + 'px', 'important');
            s.setProperty('right', 'auto', 'important');
            s.setProperty('bottom', bottomPx + 'px', 'important');
            s.setProperty('top', 'auto', 'important');
            s.setProperty('width', wantW + 'px', 'important');
            s.setProperty('height', wantH + 'px', 'important');
            s.setProperty('max-width', (VW - M * 2) + 'px', 'important');
            s.setProperty('max-height', (VH - M * 2) + 'px', 'important');
            positioning = false;
        }

        function attachObserver() {
            var fw = document.querySelector('flowise-chatbot');
            if (!fw || !fw.shadowRoot) { setTimeout(attachObserver, 300); return; }
            // childList detecta la primera vez que [part="bot"] entra al shadow;
            // attributeFilter=['class'] detecta aperturas/cierres (opacity-0 <-> opacity-1).
            try {
                new MutationObserver(function () { requestAnimationFrame(positionChatWindow); })
                    .observe(fw.shadowRoot, { childList: true, subtree: true, attributes: true, attributeFilter: ['class'] });
            } catch (e) { /* MutationObserver no disponible: el resize + click siguen funcionando */ }
            positionChatWindow();
        }

        // Reaccionar a aperturas/cierres disparados por clicks (en el Lottie o en cualquier parte).
        document.addEventListener('click', function () { requestAnimationFrame(positionChatWindow); }, true);
        // Reaccionar a cambios de tamaño/orientación.
        window.addEventListener('resize', function () { requestAnimationFrame(positionChatWindow); }, { passive: true });

        if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', attachObserver);
        else attachObserver();
    })();
    </script>
