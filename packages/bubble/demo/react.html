<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ecoflow Bubble — demo React</title>
    <!-- React vía esm.sh solo para la demo; en una app real viene de node_modules -->
    <script type="importmap">
        {
            "imports": {
                "react": "https://esm.sh/react@18.3.1",
                "react-dom/client": "https://esm.sh/react-dom@18.3.1/client",
                "@koppi/ecoflow-bubble/react": "../dist/ecoflow-bubble-react.mjs"
            }
        }
    </script>
    <style>
        body { margin: 0; font-family: system-ui, sans-serif; min-height: 100vh; background: #f4f1ec; display: flex; align-items: center; justify-content: center; }
        .card { max-width: 520px; padding: 40px; background: #fff; border-radius: 16px; box-shadow: 0 10px 40px rgba(0,0,0,.12); }
        button.app { padding: 10px 18px; border-radius: 10px; border: none; background: #1b2f55; color: #fff; font-size: 15px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Ecoflow Bubble — React</h1>
        <p>Mismo widget como componente React: <code>&lt;EcoflowChat config=&#123;...&#125; /&gt;</code>.</p>
        <p><button class="app" id="open-btn">Abrir chat con la API imperativa</button></p>
    </div>
    <div id="root"></div>

    <script type="module">
        import { StrictMode, createElement, useCallback, useEffect, useRef } from 'react'
        import { createRoot } from 'react-dom/client'
        // El import del wrapper define <ecoflow-chat> y expone el componente
        import { EcoflowChat } from '@koppi/ecoflow-bubble/react'

        function App() {
            const chatRef = useRef(null)
            const onReady = useCallback((element) => { chatRef.current = element }, [])
            useEffect(() => {
                const button = document.getElementById('open-btn')
                const handler = () => chatRef.current?.open()
                button.addEventListener('click', handler)
                return () => button.removeEventListener('click', handler)
            }, [])
            return createElement(EcoflowChat, {
                onReady,
                config: {
                    chatflowId: 'f98edc6a-940e-40d4-88b7-986e8813965a',
                    apiHost: 'https://ecoflow.koppi.mx',
                    buttonType: 'icon',
                    buttonSide: 'right',
                    buttonBottom: '20px',
                    buttonOffsetX: '20px',
                    buttonBackgroundColor: '#1b2f55',
                    windowTitle: 'React + Ecoflow',
                    windowWelcomeMessage: '¡Hola! Este widget corre como componente React.'
                }
            })
        }

        createRoot(document.getElementById('root')).render(
            createElement(StrictMode, null, createElement(App))
        )
    </script>
</body>
</html>
