<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ecoflow Bubble — React con perfiles de proyecto</title>
    <!-- React vía esm.sh solo para la demo; en una app real viene de node_modules -->
    <script type="importmap">
        {
            "imports": {
                "react": "https://esm.sh/react@18.3.1",
                "react-dom/client": "https://esm.sh/react-dom@18.3.1/client",
                "@koppi/ecoflow-bubble/react": "../dist/ecoflow-bubble-react.mjs"
            }
        }
    </script>
    <style>
        body { margin: 0; font-family: system-ui, sans-serif; min-height: 100vh; background: #f4f6f4; display: grid; place-items: center; }
        .card { max-width: 620px; padding: 40px; background: #fff; border-radius: 16px; box-shadow: 0 10px 40px rgba(0,0,0,.12); }
        .profiles { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 24px; }
        button.app { padding: 10px 18px; border: none; border-radius: 10px; color: #fff; font-size: 15px; cursor: pointer; }
        .castilla { background: #c9972b; }
        .alcala { background: #079d94; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Ecoflow Bubble — React</h1>
        <p>Los dos perfiles usan <code>&lt;EcoflowChat config=&#123;...&#125; /&gt;</code> y su color de marca como tinte liquid glass.</p>
        <div class="profiles">
            <button class="app castilla" id="open-castilla">Abrir Reserva Castilla</button>
            <button class="app alcala" id="open-alcala">Abrir Real Alcalá Sur</button>
        </div>
    </div>
    <div id="root"></div>

    <script type="module">
        import { StrictMode, createElement, useCallback, useEffect, useRef } from 'react'
        import { createRoot } from 'react-dom/client'
        // El import del wrapper define <ecoflow-chat> y expone el componente
        import { EcoflowChat } from '@koppi/ecoflow-bubble/react'

        const projects = {
            castilla: {
                chatflowId: '74813737-0ed3-4e82-a1ce-9ed90d879632',
                apiHost: 'https://ecoflow.koppi.mx',
                buttonType: 'icon',
                buttonSide: 'left',
                buttonBottom: '24px',
                buttonOffsetX: '24px',
                buttonBackgroundColor: '#c9972b',
                glassTintColor: '#c9972b',
                textInputSendButtonColor: '#c9972b',
                userMessageBackgroundColor: '#8c671b',
                windowTitle: 'Reserva Castilla',
                windowWelcomeMessage: '¡Hola! Soy el asistente virtual de Reserva Castilla. ¿Qué te gustaría conocer del desarrollo?',
                glass: true,
                persistConversation: true
            },
            alcala: {
                chatflowId: '8e51eda7-26a9-43c6-b284-71f02baf5c71',
                apiHost: 'https://ecoflow.koppi.mx',
                buttonType: 'icon',
                buttonSide: 'right',
                buttonBottom: '24px',
                buttonOffsetX: '24px',
                buttonBackgroundColor: '#079d94',
                glassTintColor: '#079d94',
                textInputSendButtonColor: '#079d94',
                userMessageBackgroundColor: '#0b726c',
                windowTitle: 'Real Alcalá Sur',
                windowWelcomeMessage: '¡Hola! Soy el asistente virtual de Real Alcalá Sur. ¿Cómo puedo ayudarte?',
                glass: true,
                persistConversation: true
            }
        }

        function App() {
            const castillaRef = useRef(null)
            const alcalaRef = useRef(null)
            const onCastillaReady = useCallback((element) => { castillaRef.current = element }, [])
            const onAlcalaReady = useCallback((element) => { alcalaRef.current = element }, [])
            useEffect(() => {
                const castillaButton = document.getElementById('open-castilla')
                const alcalaButton = document.getElementById('open-alcala')
                const openCastilla = () => castillaRef.current?.open()
                const openAlcala = () => alcalaRef.current?.open()
                castillaButton.addEventListener('click', openCastilla)
                alcalaButton.addEventListener('click', openAlcala)
                return () => {
                    castillaButton.removeEventListener('click', openCastilla)
                    alcalaButton.removeEventListener('click', openAlcala)
                }
            }, [])
            return createElement('div', null,
                createElement(EcoflowChat, { onReady: onCastillaReady, config: projects.castilla }),
                createElement(EcoflowChat, { onReady: onAlcalaReady, config: projects.alcala })
            )
        }

        createRoot(document.getElementById('root')).render(
            createElement(StrictMode, null, createElement(App))
        )
    </script>
</body>
</html>
