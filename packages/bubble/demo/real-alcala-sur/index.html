<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Real Alcalá Sur — Ecoflow Bubble</title>
    <style>
        :root { color-scheme: dark; }
        body {
            min-height: 100vh;
            margin: 0;
            display: grid;
            place-items: center;
            overflow: hidden;
            font-family: Poppins, ui-sans-serif, system-ui, sans-serif;
            color: #efffff;
            background: #082624;
        }
        .photo-showcase {
            position: fixed;
            inset: 0;
            z-index: 0;
            display: grid;
            grid-template-columns: 1.15fr .85fr 1.15fr;
            gap: 4px;
            overflow: hidden;
            background: #082624;
        }
        .scene {
            min-width: 0;
            background: center / cover no-repeat;
        }
        .scene::after {
            display: block;
            height: 100%;
            content: '';
            background:
                linear-gradient(130deg, rgba(5, 114, 108, .20), rgba(3, 28, 27, .50)),
                radial-gradient(circle at 52% 24%, transparent 20%, rgba(3, 29, 28, .42));
        }
        .scene--facade { background-image: url('https://images.unsplash.com/photo-1600585154340-be6161a56a0c?auto=format&fit=crop&w=1200&q=85'); }
        .scene--interior { background-image: url('https://images.unsplash.com/photo-1600607688969-a5bfcd646154?auto=format&fit=crop&w=1200&q=85'); }
        .scene--pool { background-image: url('https://images.unsplash.com/photo-1600210492486-724fe5c67fb0?auto=format&fit=crop&w=1200&q=85'); }
        @media (max-width: 700px) {
            .photo-showcase { grid-template-columns: 1.15fr .85fr; }
            .scene--pool { display: none; }
        }
        .panel {
            position: relative;
            z-index: 1;
            width: min(560px, calc(100vw - 48px));
            padding: 40px;
            border: 1px solid rgba(255, 255, 255, .16);
            border-radius: 24px;
            background: rgba(4, 37, 35, .58);
            box-shadow: 0 24px 70px rgba(0, 0, 0, .32);
            backdrop-filter: blur(12px);
        }
        .eyebrow { color: #7de2dc; font-size: .78rem; font-weight: 700; letter-spacing: .15em; text-transform: uppercase; }
        h1 { margin: 10px 0 14px; font-size: clamp(2rem, 5vw, 3rem); }
        p { max-width: 44ch; margin: 0; color: rgba(239, 255, 255, .8); line-height: 1.6; }
        .swatch { display: inline-flex; gap: 9px; align-items: center; margin-top: 24px; color: #7de2dc; font-size: .9rem; }
        .swatch::before { width: 12px; height: 12px; border-radius: 50%; background: #079d94; box-shadow: 0 0 0 4px rgba(7, 157, 148, .22); content: ''; }
        /* Ajuste exclusivo de este índice; los demás embeds mantienen sus defaults. */
        ecoflow-chat::part(window) {
            background: rgba(255, 255, 255, .07);
        }
        ecoflow-chat::part(input) {
            background: rgba(255, 255, 255, .08);
        }
        ecoflow-chat::part(message-bot) {
            --ec-glass-bot-bg: rgba(5, 48, 45, .66);
            --ec-glass-bot-color: #fff;
            backdrop-filter: blur(16px) saturate(140%);
            border: 1px solid rgba(255, 255, 255, .18);
            box-shadow: 0 10px 24px rgba(0, 0, 0, .22);
        }
    </style>
</head>
<body>
    <div class="photo-showcase" aria-hidden="true">
        <div class="scene scene--facade"></div>
        <div class="scene scene--interior"></div>
        <div class="scene scene--pool"></div>
    </div>
    <main class="panel">
        <div class="eyebrow">Demo de integración</div>
        <h1>Real Alcalá Sur</h1>
        <p>El mismo componente se prueba sobre fachada, interior y espacios exteriores para comparar el liquid glass con distintos tonos.</p>
        <div class="swatch">Turquesa Real Alcalá Sur · #079d94</div>
    </main>

    <script
        src="../../dist/ecoflow-bubble.js"
        data-chatflowid="8e51eda7-26a9-43c6-b284-71f02baf5c71"
        data-api-host="https://ecoflow.koppi.mx"
        data-button-background-color="#079d94"
        data-glass-tint-color="#079d94"
        data-text-input-send-button-color="#079d94"
        data-user-message-background-color="#0b726c"
        data-window-title="Real Alcalá Sur"
        data-window-welcome-message="¡Hola! Soy el asistente virtual de Real Alcalá Sur. ¿Cómo puedo ayudarte?"
        data-window-width="400"
        data-window-height="500"
        data-glass="true"
        data-persist-conversation="false"
        defer
    ></script>
</body>
</html>
